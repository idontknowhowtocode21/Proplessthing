<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Colab Editor</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="dark-mode">

    <header class="main-header">
        <div class="nav-row">
            <div class="left">
                <span id="menuTrigger" class="icon-btn">☰</span>
                <img src="https://upload.wikimedia.org/wikipedia/commons/d/da/Google_Drive_logo.png" class="drive-logo">
                <span class="filename">Untitled3.ipynb</span>
            </div>
            <div class="right">
                <span class="icon">🔍</span>
                <span class="icon">➕</span>
                <span class="icon badge">3</span>
                <span class="icon">⋮</span>
            </div>
        </div>
        <div class="tool-row">
            <div class="tools-left">
                <span>＋</span> <span>＜ ＞</span> <span>⬆</span> <span>⬇</span> 
                <span id="magicTrigger" style="color: #4ade80;">🪄</span> <span>🗑</span>
            </div>
            <div class="colab-status">
                <span class="status-check">✓</span>
                <span class="status-text">RAM</span>
                <div class="mini-bar"><div class="fill" style="width: 30%;"></div></div>
                <span class="status-text">Disk</span>
                <div class="mini-bar"><div class="fill" style="width: 45%;"></div></div>
                <span class="status-arrow">⌃</span>
            </div>
        </div>
    </header>

    <main class="content">
        <div class="cell-container">
            <div class="cell-gutter">
                <span id="executeBtn" class="play-btn">▶</span>
            </div>
            <div class="cell-editor">
                <input type="text" id="inputField" placeholder="Title" autocomplete="off" spellcheck="false">
                <div class="horizontal-line"></div>
                <textarea id="outputField" placeholder="Start typing..."></textarea>
            </div>
        </div>
    </main>

    <div id="peekStrip"></div>

    <div id="secretMenu" class="modal hidden">
        <div class="modal-box">
            <h2>Vault Settings</h2>
            <p>Edit Reveal Text (Use [WORD] as placeholder):</p>
            <input type="text" id="templateSetting" placeholder="Your thought of word is [WORD]">
            
            <p>Add Custom Word to DB:</p>
            <input type="text" id="newWordInput" placeholder="Enter word...">
            <div class="modal-btns">
                <button id="saveWord">Add Word</button>
                <button id="closeMenu">Close</button>
            </div>
        </div>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
